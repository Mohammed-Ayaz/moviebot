[project]
name = "moviebot"
version = "0.1.0"
description = "Discord bot for movie nights: a shared watchlist, suggestions, verdicts and an AI round trip"
readme = "README.md"
authors = [{ name = "Mohammed Ayaz" }]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "aiosqlite>=0.22.1",
    "discord-py>=2.7.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W/F: errors and style, I: import order, B: likely bugs, UP: modern syntax,
# ASYNC: blocking calls inside async code, S: security checks such as SQL built from strings.
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
